packages:
  apt:
    personal:
      # Core Unix tools
      - sed
      - tmux
      - wget
      # Development and system utilities
      - make
      - ipcalc
      - minicom
      - nmap
      - mtr-tiny
      - graphviz
      - poppler-utils
      - 7zip
      # Virtualization (x86 guests)
      - qemu-system-x86
      - qemu-utils
      # Official Docker apt repository (configured by the before script)
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      # GnuPG and graphical passphrase prompts
      - gnupg
      - pinentry-gnome3
      # YubiKey runtime and native build dependencies for pyscard (uv/mise)
      - pcscd
      - libccid
      - libpcsclite1
      - libpcsclite-dev
      - libusb-1.0-0
      - build-essential
      - swig
      # Desktop
      - kitty
      - keyd
      - gnome-tweaks
      # External monitor brightness (GNOME DDC extension)
      - ddcutil
      - dconf-cli
  homebrew:
    # Shared by personal and work macOS machines.
    formulae:
      - gnu-sed
      - btop
      - tmux
      - wget
      - pinentry-mac
      - colima
      - lima
      - gnupg
      - docker
      - docker-compose
      - make
      - ipcalc
      - minicom
      - nmap
      - mtr
      - ykman
      - graphviz
      - poppler
      - sevenzip
      - qemu
    casks:
      - kitty
      - keepingyouawake
      - raycast
      - rectangle
      - yubico-authenticator
      - betterdisplay
      - wireshark-app
      - visual-studio-code
      - zed
      - obsidian
      - font-hack-nerd-font
      - font-meslo-lg-nerd-font
