cpus: 8
memory: 8GiB
disk: 60GiB
mounts:
  - location: "~"
  - location: "~/projects"
    writable: true
vmType: vz
networks:
  - vzNAT: true
ssh:
  forwardAgent: true
portForwards:
  # GPG main socket
  - guestSocket: "/run/user/{{.UID}}/gnupg/S.gpg-agent"
    hostSocket: "{{.Home}}/.gnupg/S.gpg-agent.extra"
    reverse: true
  # SSH socket from gpg-agent
  - guestSocket: "/run/user/{{.UID}}/gnupg/S.gpg-agent.ssh"
    hostSocket: "{{.Home}}/.gnupg/S.gpg-agent.ssh"
    reverse: true
provision:
  - mode: system
    script: |
      #!/bin/bash
      export DEBIAN_FRONTEND=noninteractive
      apt update
      apt-get install -y build-essential git curl unzip python3 python3-venv zsh neovim git-delta
      chsh -s /usr/bin/zsh {{.User}}
  - mode: user
    script: |
      #!/bin/bash
      export DEBIAN_FRONTEND=noninteractive
      mkdir -p ~/.local/share/zsh/site-functions
      mkdir -p /run/user/$UID/gnupg
      chmod 700 /run/user/$UID/gnupg
      curl https://mise.run | MISE_INSTALL_PATH=~/bin/mise sh
      curl -sS https://starship.rs/install.sh | BIN_DIR=~/bin FORCE=1 sh
      sh -c "$(curl -fsLS https://get.chezmoi.io)" -- init --apply antonu17
      starship completions zsh > ~/.local/share/zsh/site-functions/_starship
      chezmoi completions zsh > ~/.local/share/zsh/site-functions/_chezmoi
